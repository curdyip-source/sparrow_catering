services:
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: on `up` overwrite the DB with the dump from the git-crypt volume.
  db-restore:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-db-restore
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.volume:/backup
      - ./docker/db-restore.sh:/db-restore.sh:ro
    entrypoint: ["sh", "/db-restore.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Sidecar: idles until `docker compose stop`/`down`, then dumps the DB to the volume.
  db-backup:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-db-backup
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.volume:/backup
      - ./docker/db-backup.sh:/db-backup.sh:ro
    entrypoint: ["sh", "/db-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 2m
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    ports:
      - "${REDIS_PORT}:6379"

  backend:
    build:
      context: ./backend
    container_name: ${PROJECT_NAME}-backend
    env_file:
      - .env
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT}
    command: sh -c "python -m app.db.wait_for_db && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT}"
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      db-restore:
        condition: service_completed_successfully

  celery:
    build:
      context: ./backend
    container_name: ${PROJECT_NAME}-celery
    env_file:
      - .env
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
      db-restore:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    container_name: ${PROJECT_NAME}-frontend
    env_file:
      - .env
    environment:
      # выводим из BACKEND_PORT, чтобы при смене блока не править вручную
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT}
    command: npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT} --strictPort
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend

volumes:
  postgres_data:
